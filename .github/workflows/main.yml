name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Preparar assinatura
        env:
          KS: ${{ secrets.KEYSTORE_B64 }}
        run: echo "$KS" | base64 -d > app/assistente.jks
      - name: Obter biblioteca de voz (sherpa-onnx)
        run: |
          mkdir -p app/libs
          curl -fL -o app/libs/sherpa-onnx.aar https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.8/sherpa-onnx-1.13.8.aar
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: assistente-apk
          path: app/build/outputs/apk/debug/*.apk
